<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>★ girl00420.lol ★</title>
  <style>
    /* Y2K & Retro Fonts */
    @import url('https://googleapis.com');

    :root {
      --bg-dark: #0d001a;
      --pink-neon: #ff66c4;
      --pink-soft: #ffb3e6;
      --cyan-neon: #00f0ff;
      --purple-box: rgba(25, 8, 46, 0.92);
      --border-glow: 0 0 10px #ff66c4, inset 0 0 8px rgba(255, 102, 196, 0.4);
    }

    * {
      box-sizing: border-box;
      cursor: crosshair;
    }

    body {
      margin: 0;
      padding: 20px 10px;
      background-color: var(--bg-dark);
      /* Retro Y2K starry grid background */
      background-image: 
        radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
        radial-gradient(#ff66c4, rgba(255,102,196,.15) 1px, transparent 2px),
        linear-gradient(rgba(255, 102, 196, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.12) 1px, transparent 1px);
      background-size: 120px 120px, 80px 80px, 30px 30px, 30px 30px;
      color: #fff;
      font-family: 'Courier Prime', monospace;
      font-size: 14px;
    }

    /* Scrolling Marquee Top Banner */
    .marquee-bar {
      max-width: 960px;
      margin: 0 auto 15px auto;
      background: linear-gradient(90deg, #ff0080, #7928ca, #00f0ff);
      border: 2px solid #fff;
      padding: 5px;
      font-family: 'Pixelify Sans', sans-serif;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: var(--border-glow);
    }

    /* Main MySpace 2-Column Container */
    .myspace-container {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .myspace-container {
        grid-template-columns: 1fr;
      }
    }

    /* Retro Window Boxes */
    .box {
      background: var(--purple-box);
      border: 2px solid var(--pink-neon);
      box-shadow: var(--border-glow);
      margin-bottom: 20px;
      position: relative;
    }

    .box-header {
      background: linear-gradient(90deg, #ff66c4, #8a2be2);
      color: #fff;
      padding: 6px 10px;
      font-family: 'Pixelify Sans', sans-serif;
      font-weight: bold;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--pink-neon);
      text-shadow: 1px 1px 0px #000;
    }

    .window-controls {
      font-size: 11px;
      letter-spacing: 2px;
    }

    .box-content {
      padding: 14px;
    }

    /* Left Column: Profile Card */
    .profile-pic-wrap {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .profile-pic {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border: 2px solid var(--cyan-neon);
      box-shadow: 0 0 8px var(--cyan-neon);
    }

    .profile-name {
      font-family: 'Pixelify Sans', sans-serif;
      font-size: 22px;
      color: var(--pink-neon);
      margin: 0 0 5px 0;
      text-shadow: 0 0 6px var(--pink-neon);
    }

    .online-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 6px;
      border: 1px dashed #39ff14;
      color: #39ff14;
      font-size: 12px;
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .mood-box {
      background: rgba(255, 102, 196, 0.15);
      border: 1px dashed var(--pink-soft);
      padding: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    /* MySpace Contact Table */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 12px;
    }

    .contact-btn {
      background: #1a0533;
      border: 1px solid var(--cyan-neon);
      color: var(--cyan-neon);
      padding: 5px;
      text-align: center;
      text-decoration: none;
      transition: 0.2s;
    }

    .contact-btn:hover {
      background: var(--cyan-neon);
      color: #000;
      font-weight: bold;
    }

    /* Y2K Music Player */
    .song-item {
      border-bottom: 1px dashed rgba(255, 255, 255, 0.25);
      padding: 8px 0;
    }
    .song-item:last-child { border-bottom: none; }

    .song-title {
      color: var(--cyan-neon);
      font-weight: bold;
      display: block;
    }

    .song-artist {
      color: var(--pink-soft);
      font-size: 12px;
    }

    /* Right Column: Extended Network Banner */
    .network-banner {
      border: 2px solid #fff;
      padding: 15px;
      text-align: center;
      margin-bottom: 20px;
      background: rgba(0, 0, 0, 0.65);
      box-shadow: 0 0 12px var(--cyan-neon);
    }

    .network-banner h2 {
      margin: 0;
      font-family: 'Pixelify Sans', sans-serif;
      font-size: 19px;
      color: #fff;
    }

    /* Interactive Bookshelf */
    .shelf-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: #1a0533;
      border: 1px solid var(--pink-neon);
      color: #fff;
      padding: 6px 12px;
      font-family: 'Pixelify Sans', sans-serif;
      font-size: 13px;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--pink-neon);
      color: #000;
      font-weight: bold;
    }

    .bookshelf-wood {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 15px;
      padding: 15px 10px 8px 10px;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 88%, #4a2511 88%, #2e1507 100%);
      border-bottom: 6px solid #1f0d04;
      border-radius: 4px;
    }

    .book-card {
      text-align: center;
      transition: transform 0.2s;
    }

    .book-card:hover {
      transform: translateY(-6px) rotate(-2deg);
    }

    .book-cover {
      width: 85px;
      height: 125px;
      object-fit: cover;
      border: 1px solid #fff;
      box-shadow: 3px 3px 0px rgba(0,0,0,0.8);
      background: #222;
    }

    .book-name {
      font-size: 11px;
      margin-top: 5px;
      color: var(--pink-soft);
      line-height: 1.2;
    }

    .hidden { display: none; }

    /* Favorite Movies Row */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
      gap: 12px;
    }

    .movie-card {
      background: #110321;
      border: 1px solid var(--cyan-neon);
      padding: 6px;
      text-align: center;
    }

    .movie-poster {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-bottom: 1px solid var(--cyan-neon);
      margin-bottom: 5px;
    }

    .movie-title {
      font-size: 12px;
      font-weight: bold;
      color: #fff;
    }

    .movie-stars {
      color: #ffe600;
      font-size: 11px;
    }

    /* Tumblr / Scrapbook Photo Wall */
    .scrapbook-wall {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px;
      padding: 15px 5px;
      background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    .polaroid {
      background: #fdfdfd;
      color: #111;
      padding: 10px 10px 25px 10px;
      width: 175px;
      box-shadow: 4px 6px 12px rgba(0, 0, 0, 0.85);
      position: relative;
      transition: transform 0.25s ease;
    }

    .polaroid:nth-child(odd) { transform: rotate(-3deg); }
    .polaroid:nth-child(even) { transform: rotate(2.5deg); }
    .polaroid:hover {
      transform: scale(1.08) rotate(0deg);
      z-index: 10;
    }

    /* Washi Tape Effect */
    .polaroid::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 65px;
      height: 18px;
      background: rgba(255, 102, 196, 0.65);
      border-left: 2px dotted rgba(255,255,255,0.6);
      border-right: 2px dotted rgba(255,255,255,0.6);
    }

    .polaroid:nth-child(even)::before {
      background: rgba(0, 240, 255, 0.65);
      transform: translateX(-50%) rotate(3deg);
    }

    .polaroid img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border: 1px solid #ddd;
    }

    .polaroid-caption {
      margin-top: 8px;
      font-family: 'Courier Prime', monospace;
      font-size: 12px;
      text-align: center;
      font-weight: bold;
    }

    .sticker-tag {
      display: inline-block;
      background: #ffe600;
      color: #000;
      font-family: 'Pixelify Sans', sans-serif;
      font-weight: bold;
      padding: 3px 8px;
      transform: rotate(-4deg);
      border: 1px solid #000;
      font-size: 12px;
      margin: 4px;
    }
  </style>
</head>
